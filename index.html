<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#161b22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="ErgoGRO — Laudos Técnicos Ergonômicos AEP / Psicossocial / AET">
  <title>ErgoGRO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="sem-nav">

  <!-- ── Header fixo ──────────────────────────────────────── -->
  <header id="app-header">
    <button id="btn-voltar" class="oculto" title="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Voltar
    </button>
    <div class="logo" id="logo-header">Ergo<span>GRO</span></div>
    <span id="titulo-header"
          style="flex:1;font-size:var(--txt-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></span>
    <div id="header-badge"></div>
  </header>

  <!-- ── Conteúdo principal ───────────────────────────────── -->
  <main id="app-content">

    <!-- INÍCIO / PROJETOS DE LAUDO -->
    <div id="tela-dashboard" class="tela ativa"></div>

    <!-- CADASTRO DE EMPRESAS -->
    <div id="tela-empresas" class="tela"></div>

    <!-- PLANO DE AÇÃO GLOBAL -->
    <div id="tela-plano-geral" class="tela"></div>

    <!-- CENTRAL DE RELATÓRIOS -->
    <div id="tela-relatorios" class="tela"></div>

    <!-- SHELL: PROJETO DE LAUDO (sub-nav gerado por ModuloProjeto) -->
    <div id="tela-projeto" class="tela"></div>

    <!-- SHELLS DE AVALIAÇÃO (sub-nav gerado por cada módulo) -->
    <div id="tela-aep" class="tela"></div>
    <div id="tela-fp"  class="tela"></div>
    <div id="tela-aet" class="tela"></div>

  </main>

  <!-- ── Navegação principal (telas de nível superior) ────── -->
  <nav id="nav-principal" class="oculto">
    <button data-nav="dashboard">
      <span class="nav-icon">🏠</span>
      <span>Início</span>
    </button>
    <button data-nav="empresas">
      <span class="nav-icon">🏢</span>
      <span>Empresas</span>
    </button>
    <button data-nav="plano-geral">
      <span class="nav-icon">📌</span>
      <span>Plano</span>
    </button>
    <button data-nav="relatorios">
      <span class="nav-icon">📊</span>
      <span>Relatórios</span>
    </button>
  </nav>

  <!-- ── Toast ────────────────────────────────────────────── -->
  <div id="toast"></div>

  <!-- ── Firebase SDK (para módulo de pesquisa psicossocial) ── -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- ── Scripts (ordem de dependência) ───────────────────── -->
  <script src="js/storage.js"></script>
  <script src="js/psicossocial-perguntas.js"></script>
  <script src="js/firebase-pesquisa.js"></script>
  <script src="js/modules/avaliacao.js"></script>
  <script src="js/modules/copsoq.js"></script>
  <script src="js/modules/aep.js"></script>
  <script src="js/modules/fatores-psicossociais.js"></script>
  <script src="js/modules/aet.js"></script>
  <script src="js/modules/cadastro.js"></script>
  <script src="js/modules/projeto.js"></script>
  <script src="js/modules/pesquisa-admin.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/plano-acao.js"></script>
  <script src="js/modules/relatorio.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
