<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#161b22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Consulta Ergonômica — ErgoGRO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="sem-nav">

  <header id="app-header">
    <div class="logo" style="margin:auto">Ergo<span>GRO</span></div>

  <main style="padding-bottom:80px">
    <div class="container">
      <div id="consulta-body" style="margin-top:var(--s4)">
        <div class="card" style="text-align:center;padding:var(--s6)">

          <div style="font-weight:600">Carregando consulta…</div>

      </div>

  <script src="js/firebase-pesquisa.js?v=4"></script>
